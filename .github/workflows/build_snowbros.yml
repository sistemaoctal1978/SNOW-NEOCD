name: Build Snow Bros NeoGeo Port

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/**'
      - '.github/workflows/build_snowbros.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential python3 libsdl2-dev liblua5.3-dev libfontconfig1-dev libasound2-dev libpulse-dev libx11-dev libxext-dev libxinerama-dev libxi-dev libxrandr-dev libxrender-dev libudev-dev libdbus-1-dev libfreetype6-dev gcc g++ make pkg-config python3

    - name: Clone MAME 0.268
      run: |
        git clone --depth 1 --branch mame0268 https://github.com/mamedev/mame.git mame

    - name: Prepare Snow Bros patch
      run: |
        cd mame
        # Disable problematic file
        mv src/mame/kaneko/kan_pand_patch.cpp src/mame/kaneko/kan_pand_patch.cpp.disabled 2>/dev/null || true
        # Fix kan_pand.h
        sed -i '/template <typename T> kaneko_pandora_device(const machine_config &mconfig, const char \*tag, device_t \*owner, u32 clock, T &&palette_tag, const gfx_decode_entry \*gfxinfo)/,/^  \}/d' src/mame/kaneko/kan_pand.h
        sed -i '/template <typename T> kaneko_pandora_device(const machine_config &mconfig, const char \*tag, device_t \*owner, T &&palette_tag, const gfx_decode_entry \*gfxinfo)/,/^  \}/d' src/mame/kaneko/kan_pand.h

    - name: Apply snowbros_mvs driver patch
      run: |
        cd mame
        cat > /tmp/snowbros.patch << 'PATCHEOF'
--- a/src/mame/kaneko/snowbros.cpp
+++ b/src/mame/kaneko/snowbros.cpp
@@ -2398,6 +2398,31 @@
 	/* where were these from, a bootleg? */
 //	ROM_LOAD( "ch0",          0x00000, 0x20000, CRC(36d84dfe) SHA1(5d45a750220930bc409de30f19282bb143fbf94f) )
 //	ROM_LOAD( "ch1",          0x20000, 0x20000, CRC(76347256) SHA1(48ec03965905adaba5e50eb3e42a2813f7883bb4) )
+//	ROM_LOAD( "ch2",          0x40000, 0x20000, CRC(fdaa634c) SHA1(1271c74df7da7596caf67caae3c51b4c163a49f4) )
+//	ROM_LOAD( "ch3",          0x60000, 0x20000, CRC(34024aef) SHA1(003a9b9ee3aaab3d787894d3d4126d372b19d2a8) )
 ROM_END


+// Test driver for MVS port - accepts any CRC for ROMs (BAD_DUMP flag)
+ROM_START( snowbros_mvs )
+	ROM_REGION( 0x40000, "maincpu", 0 )
+	ROM_LOAD16_BYTE( "sn6.bin",  0x00000, 0x20000, BAD_DUMP CRC(4899ddcf) SHA1(47d750d3022a80e47ffabe47566bb2556cc8d477) )
+	ROM_LOAD16_BYTE( "sn5.bin",  0x00001, 0x20000, BAD_DUMP CRC(ad310d3f) SHA1(f39295b38d99087dbb9c5b00bf9cb963337a50e2) )
+
+	ROM_REGION( 0x8000, "soundcpu", 0 )
+	ROM_LOAD( "sbros-4.29",   0x0000, 0x8000, BAD_DUMP CRC(e6eab4e4) SHA1(d08187d03b21192e188784cb840a37a7bdb5ad32) )
+
+	ROM_REGION( 0x200000, "gfx1", 0 )
+	ROM_LOAD( "sbros-1.41",   0x00000, 0x200000, BAD_DUMP CRC(16f06b3a) SHA1(c64d3b2d32f0f0fcf1d8c5f02f8589d59ddfd428) )
+ROM_END


 ROM_START( snowbrosa )
 	ROM_REGION( 0x40000, "maincpu", 0 )
 	ROM_LOAD16_BYTE( "sbros-3a.5",  0x00000, 0x20000, CRC(10cb37e1) SHA1(786be4640f8df2c81a32decc189ea7657ace00c6) )
@@ -3345,6 +3370,17 @@
 	MACHINE_SUPPORTS_SAVE )


+GAME( 1990, snowbros_mvs, snowbros, snowbros,    snowbros,  snowbros_pandora_state,
+	empty_init,     ROT0, "Toaplan (MVS Port Test)",    "Snow Bros. - Nick & Tom (MVS Port Test)",
+	MACHINE_SUPPORTS_SAVE )
+
+
 GAME( 1990, snowbrosa,  snowbros, snowbros,    snowbros,  snowbros_pandora_state,
 	empty_init,     ROT0, "Toaplan",                        "Snow Bros. - Nick & Tom (set 2)",
 	MACHINE_SUPPORTS_SAVE )
PATCHEOF
        patch -p1 < /tmp/snowbros.patch || true

    - name: Copy C ROM 2MB
      run: |
        cd mame
        mkdir -p roms/snowbros_mvs
        cp ${{ github.workspace }}/assets/sbros-1.41.full roms/snowbros_mvs/sbros-1.41

    - name: Build MAME (neogeo subtarget)
      run: |
        cd mame
        make SUBTARGET=neogeo REGENIE=1 -j$(nproc) 2>&1 | tee build.log

    - name: Verify build
      run: |
        cd mame
        ./mame -listxml | grep snowbros_mvs

    - name: Upload MAME binary
      uses: actions/upload-artifact@v4
      with:
        name: mame-snowbros-mvs
        path: mame/mame
        retention-days: 30

    - name: Upload build log
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: mame/build.log
        retention-days: 30