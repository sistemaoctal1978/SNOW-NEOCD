name: Build Snow Bros NeoGeo Port

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/**'
      - 'snowbros.patch'
      - '.github/workflows/build_snowbros.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential python3 libsdl2-dev liblua5.3-dev libfontconfig1-dev libasound2-dev libpulse-dev libx11-dev libxext-dev libxinerama-dev libxi-dev libxrandr-dev libxrender-dev libudev-dev libdbus-1-dev libfreetype6-dev gcc g++ make pkg-config python3

    - name: Clone MAME 0.268
      run: |
        git clone --depth 1 --branch mame0268 https://github.com/mamedev/mame.git mame

    - name: Prepare Snow Bros patch
      run: |
        cd mame
        mv src/mame/kaneko/kan_pand_patch.cpp src/mame/kaneko/kan_pand_patch.cpp.disabled 2>/dev/null || true
        sed -i '/template <typename T> kaneko_pandora_device(const machine_config &mconfig, const char \*tag, device_t \*owner, u32 clock, T &&palette_tag, const gfx_decode_entry \*gfxinfo)/,/^  \}/d' src/mame/kaneko/kan_pand.h
        sed -i '/template <typename T> kaneko_pandora_device(const machine_config &mconfig, const char \*tag, device_t \*owner, T &&palette_tag, const gfx_decode_entry \*gfxinfo)/,/^  \}/d' src/mame/kaneko/kan_pand.h

    - name: Apply snowbros_mvs driver patch
      run: |
        cd mame
        patch -p1 < ${{ github.workspace }}/snowbros.patch || true
        echo "=== Patch result ==="
        grep -n "snowbros_mvs" src/mame/kaneko/snowbros.cpp || echo "NOT FOUND"

    - name: Copy C ROM 2MB
      run: |
        cd mame
        mkdir -p roms/snowbros_mvs
        cp ${{ github.workspace }}/assets/sbros-1.41.full roms/snowbros_mvs/sbros-1.41

    - name: Build MAME (neogeo subtarget)
      run: |
        cd mame
        make SUBTARGET=neogeo REGENIE=1 -j$(nproc) 2>&1 | tee build.log

    - name: Verify build
      run: |
        cd mame
        ./mame -listxml | grep -i snowbros_mvs || echo "DRIVER NOT FOUND"

    - name: Upload MAME binary
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: mame-snowbros-mvs
        path: mame/mame
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: mame/build.log
        retention-days: 30